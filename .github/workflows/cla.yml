name: Contributor agreement

# Fails a pull request whose author has not signed CLA.md. It runs on pull_request_target, so the workflow and
# scripts/cla-check.mjs come from the base branch and a pull request can't change them, and it runs for a fork's
# first pull request without waiting for approval. This event could reach secrets and a writable token, so the job
# asks for read-only contents, uses no secrets, checks out only the base branch's script and reads the signature
# file through the API as data. Never add a checkout of the pull request's head here.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: cla-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          sparse-checkout: scripts/cla-check.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/cla-check.mjs

services:
  canoncrm:
    build:
      context: .
      dockerfile: Dockerfile.selfhost
      args:
        CANON_AUTH: ${CANON_AUTH:-local}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - data:/data
    environment:
      CANON_AUTH: ${CANON_AUTH:-local}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_JWT_ISSUER_DOMAIN: ${CLERK_JWT_ISSUER_DOMAIN:-}
      CANON_API_TOKEN_READS_PER_MINUTE: ${CANON_API_TOKEN_READS_PER_MINUTE:-}
      CANON_API_TOKEN_WRITES_PER_MINUTE: ${CANON_API_TOKEN_WRITES_PER_MINUTE:-}
      CANON_API_WORKSPACE_READS_PER_MINUTE: ${CANON_API_WORKSPACE_READS_PER_MINUTE:-}
      CANON_API_WORKSPACE_WRITES_PER_MINUTE: ${CANON_API_WORKSPACE_WRITES_PER_MINUTE:-}
    stop_grace_period: 40s
    restart: unless-stopped

volumes:
  data:
